  return `<dl><div><dt>Subtotal</dt><dd>${value?price(value.subtotal):'Not available'}</dd></div><div><dt>Discount</dt><dd>${value?price(value.discountAmount):'Not available'}</dd></div><div class="final"><dt>Final Amount</dt><dd id="final-amount">${value?price(value.total):'Not available'}</dd></div>${value?.cashReceived!==null&&value?.cashReceived!==undefined?`<div style="margin-top:12px"><dt>Change to Return</dt><dd>${value.change!==null?price(value.change):'Not available'}</dd></div>`:''}</dl>${value?.cashWarning?`<p class="help warning" style="margin-top:12px">${escapeText(value.cashWarning)}</p>`:''}`;
}
function checkoutPage() {
  const suggestion=core.suggestions.getMockSuggestedSellingPrice(state.sale.productId);
  return heading('Make a Sale','One product at a time. Preview only - nothing is saved.')+`<section class="card checkout-card"><form id="checkout-form" novalidate aria-label="Demo checkout" class="checkout-layout"><div class="checkout-details"><h2>Sale details</h2><p class="help">Choose the product and enter the actual selling price.</p><div class="field"><label for="product-search">Search products</label><input id="product-search" type="search" value="${escapeText(state.productQuery)}" autocomplete="off"></div><div class="field"><label for="sale-product">Choose Product</label><select id="sale-product" aria-describedby="sale-product-error">${productOptions()}</select>${error('sale-product-error',state.saleErrors.product)}</div><div class="form-grid"><div class="field"><label for="sale-quantity">Quantity</label><div class="stepper">${button('-','quantity-minus')}<input id="sale-quantity" inputmode="decimal" value="${escapeText(state.sale.quantity)}" aria-describedby="sale-quantity-error" autocomplete="off">${button('+','quantity-plus')}</div>${error('sale-quantity-error',state.saleErrors.quantity)}</div><div class="field"><label for="sale-price">Actual Selling Price (Rs.)</label><input id="sale-price" inputmode="decimal" value="${escapeText(state.sale.price)}" aria-describedby="sale-price-error suggested-price" autocomplete="off">${error('sale-price-error',state.saleErrors.price)}<p id="suggested-price" class="help">${suggestion?'Suggested price: '+price(suggestion)+' - a guide only. Enter the actual selling price.':'Enter the agreed selling price.'}</p></div></div><section class="checkout-optional"><h3>Discount &amp; cash <span class="help">(optional)</span></h3><div class="form-grid"><div class="field"><label for="sale-discount">Discount (%) - optional</label><input id="sale-discount" inputmode="decimal" value="${escapeText(state.sale.discount)}" aria-describedby="sale-discount-error discount-hint" autocomplete="off">${error('sale-discount-error',state.saleErrors.discount)}<p id="discount-hint" class="help">0 to 100, up to 2 decimals. Blank means no discount. No rounding.</p></div><div class="field"><label for="sale-cash">Cash Received (Rs.) - optional</label><input id="sale-cash" inputmode="decimal" value="${escapeText(state.sale.cash)}" aria-describedby="sale-cash-error" autocomplete="off">${error('sale-cash-error',state.saleErrors.cash)}</div></div></section></div><section class="checkout-review" aria-labelledby="checkout-review-title"><h2 id="checkout-review-title">Sale summary</h2><p class="help" style="margin-top:4px">Review the amount before creating a preview.</p><div class="summary" id="checkout-summary" aria-live="polite"></div><div class="sale-action"><button class="primary full" type="submit">Preview Sale</button><p class="help" style="margin-top:12px">Simulation only. No payment is processed. A sample receipt is available after a valid preview.</p></div></section></form></section>`;
}
function updateCheckout(showAll=false) {
  const subtotal=core.pos.previewTotal(state.sale.quantity,state.sale.price);
  const checked=core.checkout.calculateDemoCheckout(subtotal,state.sale.discount,state.sale.cash);
  const validation=core.pos.validatePreview(saleProduct(),state.sale.quantity,state.sale.price);
  state.saleErrors={...checked.errors,...(showAll?validation:{price:core.pos.pricePrecisionError(state.sale.price)})};
  for(const key of ['product','quantity','price','discount','cash']) {
    const node=el('sale-'+key);const output=el('sale-'+key+'-error');
    if(node) node.setAttribute('aria-invalid',String(!!state.saleErrors[key]));
    if(output) output.textContent=state.saleErrors[key]||'';
  }
  el('checkout-summary').innerHTML=checkoutSummary(checked.value);
  return {simulation:core.pos.createSaleSimulation(saleProduct(),state.sale.quantity,state.sale.price),checkout:checked.value};
}
function receiptPage() {
  if(!state.receipt) return heading('Sample Receipt')+'<p class="notice">Preview a valid sale first. No completed receipt is available.</p>';
  const {simulation:sale,checkout:summary}=state.receipt;
  return `<div class="screen-only actions">${button('New Sale','new-sale')}${button('Back to Sale','back-sale')}${button('Print Sample Receipt','print',true)}<label class="help"><input id="compact-receipt" type="checkbox" style="width:20px;min-height:20px;vertical-align:middle"${state.compactReceipt?' checked':''}> Compact receipt layout</label></div><article class="card receipt${state.compactReceipt?' compact':''}" id="sample-receipt"><div class="shop"><div class="brand"><span>Shop</span> POS</div><h1 tabindex="-1" id="receipt-heading">SAMPLE RECEIPT - DEMO ONLY</h1><p class="help">Sample date: ${date.label}</p></div><dl><div class="receipt-row"><dt>Product</dt><dd>${escapeText(sale.product.name)}</dd></div><div class="receipt-row"><dt>Quantity</dt><dd>${escapeText(sale.quantity)}</dd></div><div class="receipt-row"><dt>Actual selling price</dt><dd>${price(sale.unitPrice)}</dd></div><div class="receipt-row"><dt>Discount (%)</dt><dd>${escapeText(summary.discountPercent)}%</dd></div></dl><div class="summary">${checkoutSummary(summary)}</div>${summary.cashReceived!==null?`<dl><div class="receipt-row"><dt>Cash Received</dt><dd>${price(summary.cashReceived)}</dd></div></dl>`:''}<p class="notice">Sample only. No sale, invoice, payment or stock change was saved. No official invoice number or tax claim.</p></article>`;
}
function expensesPage() {
  const draft=state.expenseDraft,totals=core.admin.demoExpenseTotals(state.expenses,state.summaryDate);
  return heading('Shop Expenses','Demo expenses only - not saved to shop records. Starting sample date: '+date.label)+`<div class="stack"><section class="card form-width" style="width:100%"><h2>${state.editingId===null?'Enter a Demo Expense':'Correct Demo Expense'}</h2><form id="expense-form" novalidate aria-label="Demo expense entry"><div class="form-grid"><div class="field"><label for="expense-date">Expense Date</label><input id="expense-date" type="date" value="${escapeText(draft.date)}" aria-invalid="${!!state.expenseErrors.date}" aria-describedby="expense-date-error">${error('expense-date-error',state.expenseErrors.date)}</div><div class="field"><label for="expense-type">Expense type</label><select id="expense-type">${core.admin.demoExpenseTypes.map(type=>`<option${draft.type===type?' selected':''}>${type}</option>`).join('')}</select></div></div>${field('expense-description','Note (optional)',draft.description,'maxlength="160" autocomplete="off"')}<div class="field"><label for="expense-amount">Amount (Rs.)</label><input id="expense-amount" inputmode="decimal" value="${escapeText(draft.amount)}" aria-invalid="${!!state.expenseErrors.amount}" aria-describedby="expense-amount-error" autocomplete="off">${error('expense-amount-error',state.expenseErrors.amount)}</div><div class="actions"><button type="submit" class="primary">${state.editingId===null?'Add Demo Expense':'Update Demo Expense'}</button>${state.editingId!==null?button('Cancel Correction','cancel-expense'):''}</div></form>${message(state.message)}</section><section><h2 style="margin-bottom:14px">Demo Expense Summary</h2><div class="field" style="max-width:300px"><label for="expense-summary-date">Summary date</label><input id="expense-summary-date" type="date" value="${escapeText(state.summaryDate)}"><p class="help">Daily total for this date; monthly total for its calendar month.</p></div><dl class="grid metrics">${metric('Daily Demo Expenses',totals.daily===null?'Not available':money(totals.daily))}${metric('Monthly Demo Expenses',totals.monthly===null?'Not available':money(totals.monthly))}</dl><p class="help">Totals include only temporary entries on this page. Nothing is saved to shop records.</p></section><section class="card"><div class="page-head"><h2>Temporary Entries</h2>${button('Reset Demo Expenses','reset-expenses')}</div>${state.expenses.length?`<div class="table-region" role="region" aria-label="Temporary expenses" tabindex="0"><table><thead><tr><th scope="col">Date</th><th scope="col">Type / description</th><th scope="col" class="number">Amount</th><th scope="col">Actions</th></tr></thead><tbody>${state.expenses.map(entry=>`<tr><td>${escapeText(entry.date)}</td><td>${escapeText(entry.type)}${entry.description?'<br>'+escapeText(entry.description):''}</td><td class="number">${money(entry.amountPaise)}</td><td><div class="actions"><button type="button" data-edit-expense="${entry.id}" aria-label="Correct ${escapeText(entry.type)} expense">Correct</button><button type="button" data-remove-expense="${entry.id}" aria-label="Remove ${escapeText(entry.type)} expense">Remove</button></div></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">No demo expenses entered.</p>'}</section></div>`;
}
function returnsPage() {
  const sale=sales.find(item=>item.id===state.returnSaleId),result=state.returnResult;
  return heading('Return Item','Return preview only - no refund or stock change is saved.')+`<div class="stack form-width"><section class="card"><h2>Review a Demo Return</h2><form id="return-form" novalidate aria-label="Demo return review"><div class="field"><label for="return-sale">Original demo sale</label><select id="return-sale" aria-describedby="return-error"><option value="">Choose a demo sale</option>${sales.map((item,index)=>`<option value="${item.id}"${state.returnSaleId===item.id?' selected':''}>Sale ${index+1} - ${escapeText(item.productName)} - ${item.quantity} units at ${money(BigInt(item.unitPricePaise))}</option>`).join('')}</select></div>${sale?`<dl class="summary"><div class="receipt-row"><dt>Product in this sale</dt><dd>${escapeText(sale.productName)}</dd></div><div class="receipt-row"><dt>Original quantity sold</dt><dd>${sale.quantity}</dd></div><div class="receipt-row"><dt>Recorded selling price</dt><dd>${money(BigInt(sale.unitPricePaise))}</dd></div></dl>`:''}<div class="field"><label for="return-quantity">Quantity to return</label><input id="return-quantity" inputmode="decimal" value="${escapeText(state.returnQuantity)}" aria-describedby="return-error" autocomplete="off">${error('return-error',result?.error)}</div><div class="actions"><button type="submit" class="primary">Review Return Preview</button>${button('Reset Return Preview','reset-return')}</div></form><p class="help" style="margin-top:14px">Original sample sales: ${date.label}. No return history is created.</p></section>${result&&!result.error&&sale?`<section class="card" id="return-review"><h2 id="return-review-heading" tabindex="-1">Return Review - Demo Only</h2><dl class="summary"><div class="receipt-row"><dt>Product</dt><dd>${escapeText(sale.productName)}</dd></div><div class="receipt-row"><dt>Proposed quantity</dt><dd>${escapeText(result.returnedQuantity)}</dd></div><div class="receipt-row"><dt>Recorded price x selected quantity</dt><dd>${money(result.originalAmountPaise)}</dd></div><div class="receipt-row"><dt>Refund amount</dt><dd>Not available</dd></div></dl><p class="notice warning"><strong>Refund amount not available for this demo sale.</strong><br>Original discount and refund terms are missing. The recorded amount above is a reference only, not an approved refund.</p><p class="notice" role="status">Return preview only - no refund or stock change was saved.</p></section>`:''}</div>`;
}
function investmentPage() {
  return heading('Total Investment','The amount the owner says they have invested in the business.')+`<section class="card form-width"><h2>Owner-Entered Investment</h2><dl class="summary"><dt>Total Investment (Demo)</dt><dd id="investment-total" class="metric-value">${state.investment===null?'Not entered':money(state.investment)}</dd>${state.investmentPreviewNote?'<dt style="margin-top:16px">Owner note</dt><dd style="margin:4px 0 0;overflow-wrap:anywhere">'+escapeText(state.investmentPreviewNote)+'</dd>':''}</dl><form id="investment-form" novalidate aria-label="Demo investment entry"><div class="field"><label for="investment-amount">Amount Invested (Rs.)</label><input id="investment-amount" inputmode="decimal" value="${escapeText(state.investmentInput)}" aria-invalid="${!!state.investmentError}" aria-describedby="investment-error" autocomplete="off">${error('investment-error',state.investmentError)}<p class="help">Optional owner-entered amount. Not revenue, stock value or Gross Profit.</p></div>${field('investment-note','Note (optional)',state.investmentNote,'maxlength="160" autocomplete="off"')}<div class="actions"><button class="primary" type="submit">Show Demo Investment</button>${button('Reset Demo Investment','reset-investment')}</div></form>${message(state.message)}<p class="help" style="margin-top:16px">Temporary demo information only. The production definition of investment needs owner agreement. No ROI, asset value or Net Profit is calculated.</p></section>`;
}
function render(focus=true) {
  const salesperson=['checkout','receipt','expenses','returns'].includes(state.page),admin=state.page!=='home'&&!salesperson;
  document.title=(state.page==='home'?'Shop POS':state.page==='checkout'?'Make a Sale':state.page==='receipt'?'Sample Receipt':state.page[0].toUpperCase()+state.page.slice(1))+' | Offline Demo Showcase';
  const themeSelect='<label class="theme-label" for="showcase-theme">Theme<select id="showcase-theme" aria-label="Theme"><option>Light</option><option>Dark</option><option>System</option></select></label>';
  el('header-actions').innerHTML=(state.page==='home'?'<span class="help">Standalone showcase</span>':button('Back to Login','nav:home')+button('Reset Demo','reset-all'))+themeSelect;
  el('showcase-theme').value=state.theme||'Light';
  el('showcase-workspace').classList.toggle('entry-workspace',state.page==='home');
  el('showcase-sidebar').hidden=state.page==='home';
  el('showcase-sidebar').innerHTML=admin?adminNavigation():salesperson?salespersonNavigation():'';
  const screens={home,dashboard,products:stockPage,stock:stockPage,sales:reports,profit:reports,'report-home':reportsHome,checkout:checkoutPage,receipt:receiptPage,expenses:expensesPage,returns:returnsPage,investment:investmentPage};
  el('main').innerHTML=screens[state.page]();
  if(state.page==='checkout')updateCheckout();
  if(focus)el('main').focus();
}
function navigate(page) { state.page=page;state.message='';render(); }
function clearExpenseDraft() { state.expenseDraft={date:date.iso,type:'Rent',description:'',amount:''};state.editingId=null;state.expenseErrors={}; }
function resetDemo() {
  state.expenses=[];state.expenseId=1;clearExpenseDraft();state.summaryDate=date.iso;
  state.investment=null;state.investmentInput='';state.investmentNote='';state.investmentPreviewNote='';state.investmentError='';
  state.sale={productId:'',quantity:'1',price:'',discount:'',cash:''};state.saleErrors={};state.receipt=null;state.productQuery='';state.compactReceipt=false;
  state.returnSaleId='';state.returnQuantity='1';state.returnResult=null;state.stockQuery='';state.stockStatus='All products';
  state.message='Temporary demo entries reset. Original sample records are unchanged.';render();
}
function handleAction(action) {
  if(action.startsWith('nav:')) return navigate(action.slice(4));
  if(action==='reset-all') return resetDemo();
  if(action==='clear-stock') {state.stockQuery='';state.stockStatus='All products';render();el('stock-search').focus();}
  if(action==='quantity-minus'||action==='quantity-plus') {
    const next=core.pos.stepPreviewQuantity(state.sale.quantity,action==='quantity-plus'?1:-1);
    if(next!==null){state.sale.quantity=next;el('sale-quantity').value=next;updateCheckout();}
  }
  if(action==='new-sale'){state.sale={productId:'',quantity:'1',price:'',discount:'',cash:''};state.saleErrors={};state.receipt=null;state.productQuery='';navigate('checkout');el('sale-product').focus();}
  if(action==='back-sale'){navigate('checkout');el('sale-product').focus();}
  if(action==='print'&&state.receipt) window.print();
  if(action==='cancel-expense'){clearExpenseDraft();render();el('expense-date').focus();}
  if(action==='reset-expenses'){state.expenses=[];clearExpenseDraft();state.summaryDate=date.iso;state.message='Demo expenses reset. No shop records changed.';render();el('expense-date').focus();}
  if(action==='reset-return'){state.returnSaleId='';state.returnQuantity='1';state.returnResult=null;render();el('return-sale').focus();}
  if(action==='reset-investment'){state.investment=null;state.investmentInput='';state.investmentError='';state.message='Demo investment reset. No accounting record changed.';render();el('investment-amount').focus();}
}
document.addEventListener('click',event=>{
  const target=event.target.closest('button');if(!target)return;
  if(target.dataset.nav) return navigate(target.dataset.nav);
  if(target.dataset.action) return handleAction(target.dataset.action);
  if(target.dataset.editExpense){const entry=state.expenses.find(item=>item.id===Number(target.dataset.editExpense));if(entry){state.expenseDraft={date:entry.date,type:entry.type,description:entry.description,amount:core.money.demoMoneyDecimal(entry.amountPaise)};state.editingId=entry.id;state.expenseErrors={};state.message='';render();el('expense-date').focus();}}
  if(target.dataset.removeExpense){const id=Number(target.dataset.removeExpense);state.expenses=state.expenses.filter(item=>item.id!==id);if(state.editingId===id)clearExpenseDraft();state.message='Removed from this temporary preview only.';render();}
});
document.addEventListener('input',event=>{
  const {id,value}=event.target;
  if(id==='stock-search'){state.stockQuery=value;el('stock-rows').innerHTML=inventoryRows();}
  if(id==='product-search'){state.productQuery=value;el('sale-product').innerHTML=productOptions();}
  const saleKeys={'sale-quantity':'quantity','sale-price':'price','sale-discount':'discount','sale-cash':'cash'};
  if(saleKeys[id]){state.sale[saleKeys[id]]=value;state.receipt=null;updateCheckout();}
  const expenseKeys={'expense-date':'date','expense-type':'type','expense-description':'description','expense-amount':'amount'};
  if(expenseKeys[id])state.expenseDraft[expenseKeys[id]]=value;
  if(id==='return-quantity'){state.returnQuantity=value;state.returnResult=null;el('return-error').textContent='';el('return-review')?.remove();}
  if(id==='investment-amount')state.investmentInput=value;
  if(id==='investment-note')state.investmentNote=value;
});
document.addEventListener('change',event=>{
  const {id,value}=event.target;
  if(id==='showcase-theme'){state.theme=value;document.documentElement.classList.toggle('dark',value==='Dark'||(value==='System'&&window.matchMedia('(prefers-color-scheme: dark)').matches));}
  if(id==='stock-filter'){state.stockStatus=value;el('stock-rows').innerHTML=inventoryRows();}
  if(id==='sale-product'){state.sale.productId=value;state.receipt=null;const guide=core.suggestions.getMockSuggestedSellingPrice(value);el('suggested-price').textContent=guide?'Suggested price: '+price(guide)+' - a guide only. Enter the actual selling price.':'Enter the agreed selling price.';updateCheckout();}
  if(id==='expense-type')state.expenseDraft.type=value;
  if(id==='expense-summary-date'){state.summaryDate=value;render(false);el('expense-summary-date').focus();}
  if(id==='return-sale'){state.returnSaleId=value;state.returnResult=null;render(false);el('return-sale').focus();}
  if(id==='compact-receipt'){state.compactReceipt=event.target.checked;el('sample-receipt').classList.toggle('compact',state.compactReceipt);}
});
document.addEventListener('submit',event=>{
  event.preventDefault();
  if(event.target.id==='checkout-form'){
    const result=updateCheckout(true);
    if(!result.simulation||!result.checkout){const first=Object.keys(state.saleErrors).find(key=>state.saleErrors[key]);if(first)el('sale-'+first).focus();return;}
    state.receipt={simulation:result.simulation,checkout:result.checkout};navigate('receipt');el('receipt-heading').focus();
  }
  if(event.target.id==='expense-form'){
    const amount=core.money.parseDemoMoney(state.expenseDraft.amount);
    state.expenseErrors={...(!core.admin.isDemoCalendarDate(state.expenseDraft.date)?{date:'Enter a valid expense date.'}:{}),...(amount===null?{amount:'Enter a non-negative PKR amount with no more than 2 decimal places.'}:{})};
    if(Object.keys(state.expenseErrors).length){render(false);el(state.expenseErrors.date?'expense-date':'expense-amount').focus();return;}
    const entry={id:state.editingId??state.expenseId++,date:state.expenseDraft.date,type:state.expenseDraft.type,description:state.expenseDraft.description.trim(),amountPaise:amount};
    state.expenses=state.editingId===null?[...state.expenses,entry]:state.expenses.map(item=>item.id===state.editingId?entry:item);
    state.message=state.editingId===null?'Added to this temporary preview only.':'Updated in this temporary preview only.';clearExpenseDraft();render();el('expense-date').focus();
  }
  if(event.target.id==='return-form'){
    state.returnResult=core.admin.inspectDemoReturn(sales.find(item=>item.id===state.returnSaleId),state.returnQuantity);render(false);
    if(state.returnResult.error)el(state.returnSaleId?'return-quantity':'return-sale').focus();else el('return-review-heading').focus();
  }
  if(event.target.id==='investment-form'){
    const amount=core.money.parseDemoMoney(state.investmentInput);state.investmentError=amount===null?'Enter a non-negative PKR amount with no more than 2 decimal places.':'';
    if(amount!==null){state.investment=amount;state.investmentPreviewNote=state.investmentNote.trim();state.message='Investment shown in this temporary preview only.';}render(false);el('investment-amount').focus();
  }
});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',event=>{if(state.theme==='System')document.documentElement.classList.toggle('dark',event.matches);});
render(false);
</script>
</body>
</html>
