<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Retail POS — UI/UX Prototype (Demo Only)</title>
<style>
:root{--bg:#f6f7f9;--surface:#fff;--subtle:#eff2f6;--text:#17212c;--muted:#536273;--border:#d9e1e9;--primary:#176f56;--primary-text:#fff;--success:#166444;--warn:#9c5c00;--danger:#b42332;--focus:#166dd6;--shadow:0 12px 30px rgba(17,33,48,.10)}
html[data-theme=dark]{--bg:#0f141b;--surface:#18212b;--subtle:#222d39;--text:#f3f6fa;--muted:#b1bfce;--border:#394653;--primary:#49d5a0;--primary-text:#071a15;--success:#74e0af;--warn:#f4c36c;--danger:#ff9099;--focus:#a7c7ff;--shadow:0 14px 36px rgba(0,0,0,.35)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}a{color:inherit} :focus-visible{outline:3px solid var(--focus);outline-offset:3px} .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.frame{display:flex;min-height:100vh}.sidebar{flex:0 0 242px;background:var(--surface);border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;gap:10px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;font-weight:800;letter-spacing:-.3px}.mark{display:grid;place-items:center;color:var(--primary-text);background:var(--primary);width:34px;height:34px;border-radius:10px}.navgroup{font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:800;color:var(--muted);padding:15px 12px 6px}.navitem{display:block;text-align:left;width:100%;border:0;background:transparent;color:var(--muted);border-radius:9px;padding:10px 12px;font-size:14px;font-weight:600}.navitem:hover{background:var(--subtle);color:var(--text)}.navitem.active{background:var(--subtle);color:var(--primary);box-shadow:inset 3px 0 var(--primary)}.sidebottom{margin-top:auto;padding:16px 10px 0;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}.main{min-width:0;flex:1}.topbar{position:sticky;z-index:5;top:0;background:var(--surface);border-bottom:1px solid var(--border);min-height:66px;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 30px}.topright{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.content{max-width:1440px;margin:auto;padding:28px 30px 60px}.demo{display:inline-flex;align-items:center;background:var(--subtle);color:var(--muted);font-size:11px;letter-spacing:.3px;font-weight:700;border-radius:999px;padding:5px 9px}.connection{font-size:12px;color:var(--success);font-weight:700}.connection.bad{color:var(--danger)}.connection::before{content:'●';font-size:10px;margin-right:6px}.avatar{background:var(--subtle);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:700}.btn.mobilemenu{display:none}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}.eyebrow{font-size:12px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.pagehead h1{margin:2px 0 4px;font-size:28px;line-height:1.2;letter-spacing:-.6px}.intro{margin:0;color:var(--muted);font-size:14px}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.btn{border-radius:9px;border:1px solid var(--border);padding:10px 15px;min-height:44px;color:var(--text);background:var(--surface);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{filter:brightness(.96)}html[data-theme=dark] .btn:hover{filter:brightness(1.13)}.btn.primary{background:var(--primary);color:var(--primary-text);border-color:transparent}.btn.danger{color:var(--danger);border-color:var(--danger)}.btn.ghost{background:transparent}.btn.big{min-height:54px;padding:14px 20px;font-size:17px}.btn.full{width:100%}.btn.small{min-height:36px;padding:7px 10px;font-size:12px}.card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:21px;min-width:0}.card h2,.card h3{margin:0 0 14px;font-size:17px;line-height:1.35}.cardtitle{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:var(--muted)}.smalltext{font-size:13px}.tiny{font-size:12px}.grid{display:grid;gap:15px}.kpi-grid{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:15px}.kpi-value{font-size:26px;font-weight:800;letter-spacing:-.6px;margin:7px 0}.kpi-label{font-size:13px;color:var(--muted)}.kpi-change{font-size:12px;color:var(--success)}.two{grid-template-columns:1.25fr 1fr}.thirds{grid-template-columns:repeat(3,1fr)}.section{margin-top:16px}.tablewrap{overflow:auto;border-radius:10px;border:1px solid var(--border)}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}th,td{padding:12px 13px;text-align:left;border-bottom:1px solid var(--border)}th{font-size:12px;color:var(--muted);background:var(--subtle);font-weight:800}tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--subtle)}.right{text-align:right}.pill{display:inline-flex;border-radius:100px;padding:4px 9px;font-size:12px;font-weight:750;background:var(--subtle);color:var(--muted)}.pill.good{color:var(--success)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--danger)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:7px;min-width:0}.field label{font-weight:750;font-size:14px}.field input,.field select,.field textarea{width:100%;min-height:46px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);padding:10px 12px;outline:none}.field textarea{min-height:78px}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--focus);box-shadow:0 0 0 2px color-mix(in srgb,var(--focus),transparent 80%)}.hint{font-size:12px;color:var(--muted)}.formactions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.formactions .btn{min-width:115px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar .field{min-width:190px}.toolbar input,.toolbar select{min-height:42px}.notice{background:var(--subtle);border:1px solid var(--border);border-radius:10px;padding:13px 15px;font-size:14px;color:var(--text);margin:15px 0}.notice.warning{border-left:4px solid var(--warn)}.notice.error{border-left:4px solid var(--danger)}.notice.ok{border-left:4px solid var(--success)}.metricrow{display:flex;gap:14px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--border)}.metricrow>*{flex:1;min-width:135px}.value{font-weight:800;font-size:20px}.divider{border-top:1px solid var(--border);margin:18px 0}.split{display:flex;justify-content:space-between;gap:12px;align-items:center}.bargraph{height:185px;display:flex;align-items:flex-end;gap:12px;padding:10px 6px 24px;border-bottom:1px solid var(--border);position:relative}.bar{flex:1;background:var(--primary);opacity:.82;border-radius:6px 6px 0 0;min-width:12px;position:relative}.bar span{position:absolute;bottom:-23px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:11px}.bar.alt{background:var(--warn)}.subnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.segment{border:1px solid var(--border);color:var(--muted);background:var(--surface);padding:9px 14px;border-radius:8px;font-weight:750;font-size:13px}.segment.selected{background:var(--primary);color:var(--primary-text);border-color:var(--primary)}.empty{padding:34px 15px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);margin-bottom:7px}.timeline{display:grid;gap:10px}.event{display:flex;gap:13px;padding:11px;border:1px solid var(--border);border-radius:9px}.event-dot{height:11px;width:11px;background:var(--primary);border-radius:50%;margin-top:6px}.stack{display:grid;gap:16px}.login{max-width:470px;margin:8vh auto}.loginbrand{font-size:27px;font-weight:800}.pos-shell{max-width:760px;margin:12px auto}.pos-title{font-size:30px;margin:0}.pos-form{padding:28px}.pos-form .field label{font-size:15px}.pos-form .field input,.pos-form .field select{min-height:55px;font-size:16px}.pos-form .field{margin-bottom:18px}.stepper{display:grid;grid-template-columns:55px 1fr 55px;gap:9px}.stepper button{font-size:24px}.stepper input{text-align:center;font-size:22px!important;font-weight:800}.summary{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--subtle);border-radius:11px;padding:17px;margin:17px 0}.summary .bigvalue{font-size:27px;font-weight:800;letter-spacing:-.5px}.success-circle{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 16px;border-radius:50%;font-size:27px;background:color-mix(in srgb,var(--success),transparent 85%);color:var(--success)}.success-block{text-align:center;max-width:540px;margin:30px auto}.success-block h2{font-size:26px}.mono{font-variant-numeric:tabular-nums}.toast{z-index:30;position:fixed;bottom:24px;right:24px;max-width:420px;background:var(--text);color:var(--surface);padding:13px 19px;border-radius:10px;box-shadow:var(--shadow);font-size:14px}.overlay{z-index:20;position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:18px}.modal{width:min(100%,560px);max-height:90vh;overflow:auto;background:var(--surface);border-radius:16px;padding:24px;border:1px solid var(--border);box-shadow:var(--shadow)}.modal h2{font-size:22px;margin:0 0 10px}.modal .summary{font-size:14px}.footer{font-size:12px;color:var(--muted);margin-top:26px;line-height:1.5}.mobile-nav-back{display:none}
@media(max-width:1120px){.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.thirds{grid-template-columns:repeat(2,1fr)}.sidebar{flex-basis:205px}.content{padding:24px}.topbar{padding:10px 24px}}
@media(max-width:780px){.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:10;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow);width:265px}.sidebar.open{transform:translateX(0)}.btn.mobilemenu{display:inline-flex}.mobile-nav-back{display:inline-flex}.topbar{padding:10px 16px}.content{padding:20px 16px 70px}.pagehead h1{font-size:24px}.formgrid{grid-template-columns:1fr}.topright .demo{display:none}.thirds{grid-template-columns:1fr}}
@media(max-width:540px){.kpi-grid{grid-template-columns:1fr}.topbar{gap:6px}.topright{gap:5px}.connection{font-size:10px;max-width:130px;line-height:1.2}.avatar{display:none}.btn{padding:9px 11px}.pagehead{flex-direction:column}.toolbar{align-items:stretch}.toolbar .field{width:100%}.pos-form{padding:17px}.summary .bigvalue{font-size:18px;white-space:nowrap}.summary>div:first-child{max-width:48%}.topbar .demo{display:none}.card{padding:16px}.actions{width:100%}.actions .btn{flex:1}.toast{left:12px;bottom:12px;right:12px;max-width:none}.formactions{flex-direction:column-reverse}.formactions .btn{width:100%}.bargraph{gap:7px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"></div><div id="dialog-root"></div><div id="toast-root" role="status" aria-live="polite"></div>
<script>
/* Standalone DEMO. No real authentication, persistence, or database-backed sales. */
const products=[
{id:'p1',name:'Diapers',category:'Baby Care',cost:1000,stock:5,threshold:5},
{id:'p2',name:'Baby Wipes',category:'Baby Care',cost:190,stock:20,threshold:8},
{id:'p3',name:'Milk Powder',category:'Grocery',cost:2150,stock:3,threshold:5},
{id:'p4',name:'Shampoo',category:'Personal Care',cost:450,stock:28,threshold:10},
{id:'p5',name:'Soap Pack',category:'Personal Care',cost:120,stock:67,threshold:12},
{id:'p6',name:'Biscuits',category:'Grocery',cost:80,stock:0,threshold:6}];
const sales=[
{id:'TXN-01042',date:'31 Oct 2026 · 14:35',product:'Diapers',qty:2,price:1250,cost:1000,profit:500,status:'Recorded'},
{id:'TXN-01041',date:'31 Oct 2026 · 13:22',product:'Baby Wipes',qty:3,price:260,cost:190,profit:210,status:'Recorded'},
{id:'TXN-01040',date:'31 Oct 2026 · 11:10',product:'Milk Powder',qty:1,price:2490,cost:2150,profit:340,status:'Corrected'},
{id:'TXN-01039',date:'30 Oct 2026 · 18:02',product:'Shampoo',qty:2,price:580,cost:450,profit:260,status:'Recorded'},
{id:'TXN-01038',date:'30 Oct 2026 · 15:15',product:'Soap Pack',qty:4,price:160,cost:120,profit:160,status:'Recorded'}];
const nav=[['Dashboard',[['dashboard','Overview']]],['Products',[['products','Product list'],['product-new','Add product'],['product-detail','Product details'],['product-edit','Edit product']]],['Inventory',[['receive','Receive stock'],['reprice','Update purchase cost'],['adjust','Correct stock'],['movements','Stock movements'],['low-stock','Low-stock products']]],['Sales',[['sales','Sales history'],['sale-detail','Sale details'],['sale-correct','Correct sale']]],['Reports',[['reports','Daily / Monthly / Range'],['product-report','Product-wise report']]],['Operations · proposed',[['accounts','Accounts'],['settings','Settings']]]];
function readTheme(){try{return localStorage.getItem('pos-demo-theme')||'light'}catch{return 'light'}}
function saveTheme(theme){try{localStorage.setItem('pos-demo-theme',theme)}catch{}}
let state={role:'admin',page:'dashboard',theme:readTheme(),server:true,drawer:false,reportMode:'daily',product:'p1',quantity:1,price:'1200',lastSale:null,saleSearch:'',prodSearch:'',pending:false};
function e(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
const rs=n=>'Rs. '+Number(n||0).toLocaleString('en-PK',{minimumFractionDigits:2,maximumFractionDigits:2});
const findProduct=id=>products.find(p=>p.id===id)||products[0];
const kpi=(label,value,note='')=>`<div class="card"><div class="kpi-label">${e(label)}</div><div class="kpi-value mono">${e(value)}</div><div class="kpi-change">${e(note)}</div></div>`;
const btn=(text,action,cls='')=>`<button type="button" class="btn ${cls}" data-action="${e(action)}">${e(text)}</button>`;
const go=(page,role)=>{state.page=page;if(role)state.role=role;state.drawer=false;render();window.scrollTo({top:0,behavior:'instant'});};
const header=(name,desc='',action='')=>`<div class="pagehead"><div><div class="eyebrow">${state.role==='admin'?'Admin workspace':'Sales workspace'}</div><h1>${e(name)}</h1><p class="intro">${e(desc)}</p></div>${action?`<div class="actions">${action}</div>`:''}</div>`;
const status=p=>p.stock===0?'<span class="pill bad">Out of stock</span>':p.stock<=p.threshold?'<span class="pill warn">Low stock</span>':'<span class="pill good">Available</span>';
const table=(heads,rows)=>`<div class="tablewrap"><table><thead><tr>${heads.map(h=>`<th>${e(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
const selectProduct=(name='product',withoutStock=false)=>`<select id="${name}" name="${name}" required>${products.map(p=>`<option value="${p.id}" ${state.product===p.id?'selected':''}>${e(p.name)}${withoutStock?'':' — '+e(p.category)}</option>`).join('')}</select>`;
const fld=(label,input,hint='',id='')=>`<div class="field"><label ${id?'for="'+id+'"':''}>${e(label)}</label>${input}${hint?`<span class="hint">${e(hint)}</span>`:''}</div>`;
const input=(id,val,type='text',placeholder='')=>`<input id="${id}" name="${id}" type="${type}" value="${e(val)}" placeholder="${e(placeholder)}" />`;
const warnList=()=>products.filter(p=>p.stock<=p.threshold);
function chart(){let values=[32,65,48,83,56,74,92];return `<div class="bargraph" role="img" aria-label="Example daily revenue bars: Monday 32, Tuesday 65, Wednesday 48, Thursday 83, Friday 56, Saturday 74, Sunday 92 relative units">${values.map((h,i)=>`<div class="bar" style="height:${h}%"><span>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</span></div>`).join('')}</div><p class="tiny muted">Illustrative mock data, not actual sales.</p>`}
function dashboard(){return header('Dashboard','Shop overview · Saturday, 31 October 2026',btn('Receive stock','go:receive','primary'))+`<div class="grid kpi-grid">${kpi("Today's revenue",rs(25690),'Sample data')}${kpi("Today's profit",rs(4860),'Sample data')}${kpi('Monthly revenue',rs(482300),'Sample data')}${kpi('Monthly profit',rs(86420),'Sample data')}</div><div class="grid kpi-grid">${kpi('Products','6')}${kpi('Available units','123')}${kpi('Low-stock products',String(warnList().length))}${kpi('Recently received','20 units')}</div><div class="grid two section"><div class="card"><div class="cardtitle"><h2>Sales over the last 7 days</h2><span class="pill">Example chart</span></div>${chart()}</div><div class="card"><div class="cardtitle"><h2>Low-stock attention</h2>${btn('View all','go:low-stock','small')}</div>${warnList().map(p=>`<div class="split" style="margin:14px 0"><div><strong>${e(p.name)}</strong><div class="smalltext muted">${p.stock} left · threshold ${p.threshold}</div></div>${status(p)}</div>`).join('')}</div></div><div class="card section"><div class="cardtitle"><h2>Recent sales</h2>${btn('View sales','go:sales','small')}</div>${salesTable(sales.slice(0,4))}</div>`}
function productsPage(){const q=state.prodSearch.toLowerCase();const rows=products.filter(p=>p.name.toLowerCase().includes(q)).map(p=>`<tr><td><strong>${e(p.name)}</strong></td><td>${e(p.category)}</td><td>${rs(p.cost)}</td><td>${p.stock}</td><td>${p.threshold}</td><td>${status(p)}</td><td>${btn('View','go:product-detail','small')}</td></tr>`);return header('Products','Manage the products available for sale.',btn('+ Add product','go:product-new','primary'))+`<div class="card"><div class="toolbar">${fld('Search products',`<input id="prod-search" placeholder="Name of product" value="${e(state.prodSearch)}" />`,'','prod-search')}${btn('Search','search-products')}${btn('Clear','clear-products','ghost')}</div>${rows.length?table(['Product','Category','Purchase cost','Stock','Threshold','Status','Action'],rows):'<div class="empty"><strong>No products match</strong>Try another search.</div>'}</div>`}
function productForm(edit=false){let p=products[0];return header(edit?'Edit product':'Add product',edit?'Update product information without silently changing purchase-cost history.':'Enter product details and opening inventory.')+`<form class="card" data-form="product"><div class="formgrid">${fld('Product name',input('name',edit?p.name:'','text','e.g. Diapers'),'Required','name')}${fld('Category (optional)',input('category',edit?p.category:''),'Optional','category')}${edit?fld('Purchase cost',`<input value="${rs(p.cost)}" disabled />`,'Use Update purchase cost to maintain history.'):fld('Opening purchase cost (Rs.)',input('cost','1000','number'),'Required','cost')}${edit?fld('Current stock',`<input value="${p.stock} units" disabled />`,'Use Receive stock / Correct stock instead.'):fld('Initial quantity',input('initial','50','number'),'Whole units','initial')}${fld('Low-stock threshold',input('threshold',edit?p.threshold:5,'number'),'Alert when quantity is at or below threshold','threshold')}</div><div class="formactions">${btn('Cancel','go:products')}<button class="btn primary" type="submit">${edit?'Save product details':'Add product (demo)'}</button></div></form>`}
function productDetail(){let p=products[0];return header('Product details','View product inventory, receipts, sales and cost history.',btn('Edit product','go:product-edit'))+`<div class="grid kpi-grid">${kpi('Available stock',p.stock+' units')}${kpi('Current purchase cost',rs(p.cost))}${kpi('Low-stock threshold',String(p.threshold))}${kpi('Total profit (example)',rs(5200))}</div><div class="actions section">${btn('Receive stock','go:receive','primary')}${btn('Update purchase cost','go:reprice')}${btn('Correct stock','go:adjust')}</div><div class="grid two section"><div class="card"><h2>Stock additions</h2>${table(['Date','Quantity','Unit cost'],[['30 Oct 2026',20,rs(1000)],['25 Oct 2026',50,rs(1000)]].map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`))}</div><div class="card"><h2>Purchase-cost changes</h2><div class="timeline"><div class="event"><div class="event-dot"></div><div><strong>Rs. 1,000.00 → Rs. 1,100.00</strong><div class="smalltext muted">Example amendment · affects remaining stock only</div></div></div><div class="event"><div class="event-dot"></div><div><strong>Original cost recorded</strong><div class="smalltext muted">Historical completed sales keep their saved cost.</div></div></div></div></div></div><div class="card section"><h2>Product sales history</h2>${salesTable(sales.filter(s=>s.product==='Diapers'))}</div>`}
function receive(){return header('Receive stock','Increase inventory when new stock arrives.')+`<form class="card" data-form="receive"><div class="formgrid">${fld('Product',selectProduct('receiptProduct'),'','receiptProduct')}${fld('Quantity received',input('received',20,'number'),'Whole units greater than zero','received')}${fld('Receipt purchase cost (Rs.)',input('receiptCost',1000,'number'),'Check treatment of changed costs','receiptCost')}${fld('Receipt date',input('receiptDate','2026-10-31','date'),'Shop-local date','receiptDate')}</div><div class="notice warning"><strong>Purchase-cost rule:</strong> if a new receipt cost differs from the current product cost, the product owner must approve whether stock receiving also reprices all remaining inventory. Never change costs silently.</div><div class="formactions">${btn('Cancel','go:products')}<button type="submit" class="btn primary">Review stock receipt</button></div></form>`}
function reprice(){return header('Update purchase cost','Applies to all unsold units; historical sales never change.')+`<form class="card" data-form="reprice"><div class="formgrid">${fld('Product',selectProduct('costProduct'),'','costProduct')}${fld('Current purchase cost',`<input disabled value="${rs(1000)}" />`)}${fld('New purchase cost (Rs.)',input('newCost',1100,'number'),'Required','newCost')}${fld('Remaining stock affected',`<input disabled value="5 units (demo snapshot)" />`)}</div><div class="notice warning"><strong>Important:</strong> changing the purchase cost changes the cost assigned to every remaining unit. It must not recalculate previously completed sales.</div><div class="formactions"><button class="btn primary" type="submit">Review price update</button></div></form>`}
function adjust(){return header('Correct stock quantity','Inventory adjustment with before/after audit history.')+`<form class="card" data-form="adjust"><div class="formgrid">${fld('Product',selectProduct('adjustProduct'),'','adjustProduct')}${fld('Current quantity',`<input disabled value="5 units (demo)" />`)}${fld('Corrected quantity',input('correctedStock',8,'number'),'Cannot be negative','correctedStock')}${fld('Reason',`<input id="adjustReason" name="adjustReason" placeholder="Why is this correction needed?" required />`,'Recommended audit information','adjustReason')}</div><div class="notice">Example: correcting 5 units to 8 units creates a <strong>+3</strong> inventory movement. A server transaction must check concurrent changes.</div><div class="formactions"><button class="btn primary" type="submit">Review stock correction</button></div></form>`}
function movements(){let rows=[['31 Oct · 14:35','Diapers','Sold','−2','5','TXN-01042','Salesperson'],['30 Oct · 09:00','Diapers','Received','+20','7','RCV-00027','Admin'],['29 Oct · 16:42','Baby Wipes','Adjustment','+3','20','ADJ-00008','Admin'],['28 Oct · 12:00','Milk Powder','Sold','−1','3','TXN-01040','Salesperson']];return header('Inventory movements','Every inventory increase and decrease, with traceability.')+`<div class="card"><div class="toolbar">${fld('Product',`<select><option>All products</option>${products.map(p=>`<option>${e(p.name)}</option>`).join('')}</select>`)}${fld('Type',`<select><option>All movements</option><option>Sold</option><option>Received</option><option>Adjustment</option></select>`)}${btn('Apply filters','mock-filter')}</div>${table(['Date','Product','Type','Change','Resulting stock','Reference','By'],rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===3?`<strong>${e(c)}</strong>`:e(c)}</td>`).join('')}</tr>`))}</div>`}
function lowStock(){return header('Low-stock products','Items at or below their configured stock threshold.',btn('Receive stock','go:receive','primary'))+`<div class="card">${table(['Product','Available quantity','Threshold','Status','Action'],warnList().map(p=>`<tr><td><strong>${e(p.name)}</strong></td><td>${p.stock}</td><td>${p.threshold}</td><td>${status(p)}</td><td>${btn('Restock','go:receive','small')}</td></tr>`))}</div>`}
function salesTable(data){return table(['Transaction','Date & time','Product','Qty','Selling price','Revenue','Profit','Status'],data.map(s=>`<tr><td><button class="btn small" data-action="go:sale-detail">${e(s.id)}</button></td><td>${e(s.date)}</td><td>${e(s.product)}</td><td>${s.qty}</td><td>${rs(s.price)}</td><td>${rs(s.qty*s.price)}</td><td>${rs(s.profit)}</td><td><span class="pill">${e(s.status)}</span></td></tr>`))}
function salesPage(){let q=state.saleSearch.toLowerCase(),filtered=sales.filter(s=>(s.id+' '+s.product).toLowerCase().includes(q));return header('Sales history','All transactions and their recorded profit, for Admin only.')+`<div class="card"><div class="toolbar">${fld('Search by product or ID',`<input id="sales-search" value="${e(state.saleSearch)}" placeholder="Diapers or TXN-01042" />`,'','sales-search')}${btn('Search','search-sales')}${btn('Clear','clear-sales','ghost')}</div>${filtered.length?salesTable(filtered):'<div class="empty"><strong>No transactions found</strong>Try another search.</div>'}</div>`}
function saleDetail(){let s=sales[0];return header('Sale details','Original transaction and correction history.',btn('Correct this sale','go:sale-correct','primary'))+`<div class="grid two"><div class="card"><h2>${s.id}</h2><div class="metricrow"><div><div class="tiny muted">Product</div><div class="value">${e(s.product)}</div></div><div><div class="tiny muted">Quantity</div><div class="value">${s.qty}</div></div></div><div class="metricrow"><div><div class="tiny muted">Unit selling price</div><div class="value">${rs(s.price)}</div></div><div><div class="tiny muted">Historical purchase cost</div><div class="value">${rs(s.cost)}</div></div></div><div class="metricrow"><div><div class="tiny muted">Revenue</div><div class="value">${rs(s.qty*s.price)}</div></div><div><div class="tiny muted">Profit</div><div class="value">${rs(s.profit)}</div></div></div><p class="muted smalltext">${e(s.date)} · Admin-only financial information.</p></div><div class="card"><h2>Correction audit trail</h2><div class="timeline"><div class="event"><div class="event-dot"></div><div><strong>Sale recorded</strong><div class="smalltext muted">Original transaction data is retained.</div></div></div><div class="notice">Corrections must preserve the original values and atomically apply stock differences.</div></div></div></div>`}
function saleCorrect(){return header('Correct sale','Review inventory and profit impact before saving.')+`<form class="card" data-form="correct-sale"><div class="notice"><strong>Transaction:</strong> TXN-01042 · Diapers<br><span class="muted">Original quantity: 2 · Original unit selling price: ${rs(1250)} · Sale-time cost: ${rs(1000)}</span></div><div class="formgrid">${fld('Corrected quantity',input('correctedQty',1,'number'),'Quantity greater than zero','correctedQty')}${fld('Corrected selling price (Rs.)',input('correctedPrice',1250,'number'),'Sale-time cost stays unchanged','correctedPrice')}${fld('Reason',`<textarea id="saleReason" required placeholder="Explain the incorrect entry"></textarea>`,'Required audit note','saleReason')}</div><div class="notice warning">Example: changing quantity 2 → 1 must restore 1 unit to stock. Profit is recalculated using the purchase cost recorded with the original sale.</div><div class="formactions">${btn('Cancel','go:sale-detail')}<button class="btn primary" type="submit">Review correction</button></div></form>`}
function reports(){const tabs=[['daily','Daily'],['monthly','Monthly'],['custom','Custom range']];return header('Sales & profit reports','Explore revenue, quantities, profit and best-selling products.')+`<div class="subnav">${tabs.map(([id,n])=>`<button class="segment ${state.reportMode===id?'selected':''}" data-action="report:${id}">${n}</button>`).join('')}</div><div class="card"><div class="toolbar">${state.reportMode==='daily'?fld('Day',`<input type="date" value="2026-10-31" />`):state.reportMode==='monthly'?fld('Month',`<input type="month" value="2026-10" />`):`${fld('From',`<input type="date" value="2026-10-01" />`)}${fld('To',`<input type="date" value="2026-10-31" />`)}`}${btn('Apply','mock-filter','primary')}</div></div><div class="grid kpi-grid section">${kpi('Revenue',rs(25690))}${kpi('Profit',rs(4860))}${kpi('Units sold','53')}${kpi('Products sold','5')}</div><div class="grid two"><div class="card"><h2>Sales trend</h2>${chart()}</div><div class="card"><h2>Best-selling products</h2>${table(['Product','Units','Revenue'],[['Soap Pack','22',rs(3520)],['Diapers','10',rs(12500)],['Baby Wipes','8',rs(2080)]].map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`))}</div></div>`}
function productReport(){return header('Product-wise report','Revenue, profit and stock history for a selected product.')+`<div class="card"><div class="toolbar">${fld('Product',selectProduct('reportProduct'),'','reportProduct')}${fld('From',`<input type="date" value="2026-10-01" />`)}${fld('To',`<input type="date" value="2026-10-31" />`)}${btn('Apply','mock-filter','primary')}</div></div><div class="grid kpi-grid section">${kpi('Units sold','10')}${kpi('Revenue',rs(12500))}${kpi('Profit',rs(2500))}${kpi('Available units','5')}</div><div class="grid two"><div class="card"><h2>Daily sales trend</h2>${chart()}</div><div class="card"><h2>Stock receipt history</h2>${table(['Date','Quantity','Cost'],[['30 Oct',20,rs(1000)],['25 Oct',50,rs(1000)]].map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`))}</div></div>`}
function accounts(){return header('User accounts','Proposed operational screen — requires product owner approval.',btn('Add account','show:Account creation (demo only)','primary'))+`<div class="notice warning">Account administration is proposed to support the SRS requirement for distinct logins. Its exact scope has not yet been approved.</div><div class="card">${table(['User','Role','Status','Action'],[['Shop Owner','Admin','Active'],['Salesperson 01','Salesperson','Active'],['Salesperson 02','Salesperson','Disabled']].map(x=>`<tr>${x.map((v,i)=>`<td>${i===2?'<span class="pill">'+v+'</span>':v}</td>`).join('')}<td>${btn('View','show:User management (demo only)','small')}</td></tr>`))}</div>`}
function settings(){return header('Settings','Proposed preferences and local-shop operating information.')+`<div class="grid two"><div class="card"><h2>Appearance</h2><p class="muted smalltext">Change between light and dark preview themes.</p><div class="actions">${btn('Light','theme:light')}${btn('Dark','theme:dark')}</div></div><div class="card"><h2>Local shop server</h2><p class="connection ${state.server?'':'bad'}">${state.server?'Demo: server reachable':'Demo: server unreachable'}</p><p class="muted smalltext">This HTML prototype has no server. The switch below simulates its status for testing messages.</p>${btn(state.server?'Simulate outage':'Restore simulated server','toggle-server')}</div></div><div class="card section"><h2>Shop details (example)</h2><div class="metricrow"><div><div class="tiny muted">Currency</div><strong>PKR (Rs.)</strong></div><div><div class="tiny muted">Timezone</div><strong>Asia/Karachi (proposed)</strong></div><div><div class="tiny muted">Deployment</div><strong>Shop-local server + LAN</strong></div></div></div>`}
function login(){return `<div class="login"><div class="card" style="padding:30px"><div class="brand"><span class="mark">▣</span><span class="loginbrand">Retail POS</span></div><h1 style="font-size:23px">Sign in</h1><p class="muted">Enter your shop account details.</p><form data-form="login">${fld('Username',`<input id="user" autocomplete="username" placeholder="Your username" required />`,'','user')}<div style="height:14px"></div>${fld('Password',`<input type="password" id="password" autocomplete="current-password" placeholder="Your password" required />`,'','password')}<div style="height:18px"></div><button type="submit" class="btn primary full big">Sign in (demo)</button></form><div class="notice">Demo only: sign in shows a simulated Admin or Salesperson view based on the role preview selector in the header.</div></div></div>`}
function pos(){let total=(Number(state.quantity)||0)*(Number(state.price)||0);return `<div class="pos-shell">${header('Record a sale','Simple sale entry. Product, quantity and selling price only.')}<form class="card pos-form" data-form="pos">${fld('Product',selectProduct('posProduct',true),'Search / select the product being sold.','posProduct')}<div class="field"><label for="posQuantity">Quantity</label><div class="stepper">${btn('−','qty:minus') }<input id="posQuantity" name="posQuantity" type="number" min="1" step="1" inputmode="numeric" value="${e(state.quantity)}" required />${btn('+','qty:plus')}</div></div>${fld('Selling price per unit (Rs.)',`<input id="posPrice" name="posPrice" type="number" min="0.01" step="0.01" inputmode="decimal" value="${e(state.price)}" required />`,'Selling price can vary by sale.','posPrice')}<div class="summary"><div><strong>Sale total</strong><div class="tiny muted">Quantity × unit selling price</div></div><div class="bigvalue mono" id="pos-total">${rs(total)}</div></div>${state.server?'':`<div class="notice error"><strong>Demo: shop server unreachable.</strong> A real POS must not confirm a sale until the local server commits it.</div>`}<button type="submit" class="btn primary full big" ${!state.server||state.pending?'disabled':''}>${state.pending?'Processing...':'Record sale (demo)'}</button><p class="tiny muted" style="text-align:center;margin-top:13px">No stock remaining, purchase cost, or profit is shown in this Salesperson view.</p></form></div>`}
function posSuccess(){let s=state.lastSale||{id:'DEMO-01043',name:'Diapers',qty:1,price:1200,total:1200};return `<div class="pos-shell"><div class="card success-block"><div class="success-circle">✓</div><h2>Sale recorded — demo only</h2><p class="muted">This is a mocked success state. No database record was created.</p><div class="metricrow"><div><div class="tiny muted">Transaction</div><div class="value">${e(s.id)}</div></div><div><div class="tiny muted">Product</div><div class="value">${e(s.name)}</div></div></div><div class="metricrow"><div><div class="tiny muted">Quantity</div><div class="value">${e(s.qty)}</div></div><div><div class="tiny muted">Selling price</div><div class="value">${rs(s.price)}</div></div></div><div class="summary"><strong>Total</strong><strong class="bigvalue">${rs(s.total)}</strong></div>${btn('Record another sale','go:pos','primary full big')}</div></div>`}
const screens={dashboard,products:productsPage,'product-new':()=>productForm(false),'product-detail':productDetail,'product-edit':()=>productForm(true),receive,reprice,adjust,movements,'low-stock':lowStock,sales:salesPage,'sale-detail':saleDetail,'sale-correct':saleCorrect,reports,'product-report':productReport,accounts,settings,login,pos,'pos-success':posSuccess};
function sidebar(){return `<aside class="sidebar ${state.drawer?'open':''}" id="side"><div class="brand"><span class="mark">▣</span><span>Retail POS</span></div>${(state.role==='admin'?nav:[]).map(([group,items])=>`<div class="navgroup">${e(group)}</div>${items.map(([id,label])=>`<button type="button" class="navitem ${state.page===id?'active':''}" data-action="go:${id}">${e(label)}</button>`).join('')}`).join('')}${state.role==='salesperson'?`<div class="navgroup">Sales</div><button class="navitem ${state.page==='pos'?'active':''}" data-action="go:pos">Record sale</button>`:''}<div class="sidebottom"><strong>UI prototype · no data saved</strong><br>Internet not required to open this file.</div></aside>`}
function topbar(){return `<header class="topbar"><div class="actions"><button class="btn mobilemenu small" data-action="drawer" aria-label="Open navigation" aria-expanded="${state.drawer}">☰</button><span class="demo">PROTOTYPE · MOCK DATA</span></div><div class="topright"><span class="connection ${state.server?'':'bad'}">${state.server?'Local server: simulated OK':'Local server: simulated offline'}</span><button class="btn small" title="Switch light or dark theme" data-action="theme:${state.theme==='light'?'dark':'light'}">${state.theme==='light'?'☾ Dark':'☀ Light'}</button><select aria-label="Preview role" id="role" class="btn small"><option value="admin" ${state.role==='admin'?'selected':''}>Admin preview</option><option value="salesperson" ${state.role==='salesperson'?'selected':''}>Salesperson preview</option></select><button class="btn small" data-action="go:login">Sign out</button></div></header>`}
function render(){document.documentElement.setAttribute('data-theme',state.theme);document.title='Retail POS · '+state.page.replaceAll('-',' ')+' (prototype)';const safePage=state.page==='login'||(state.role==='salesperson'&&['pos','pos-success'].includes(state.page))||(state.role==='admin'&&!['pos','pos-success'].includes(state.page));if(!safePage)state.page=state.role==='admin'?'dashboard':'pos';document.getElementById('root').innerHTML=`<div class="frame">${sidebar()}<main class="main">${topbar()}<div class="content">${screens[state.page]()}<p class="footer">UI/UX review prototype only. Values and operations are simulated. This file is not connected to a database, does not enforce authentication, and must not be used for shop sales.</p></div></main></div>`;}
function toast(msg){document.getElementById('toast-root').innerHTML=`<div class="toast">${e(msg)}</div>`;clearTimeout(window.demoToastTimer);window.demoToastTimer=setTimeout(()=>document.getElementById('toast-root').innerHTML='',3300)}
function modal(title,body,onConfirm){const node=document.getElementById('dialog-root');node.innerHTML=`<div class="overlay" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h2 id="dialogTitle">${e(title)}</h2><div>${body}</div><div class="formactions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" id="confirm-modal">Confirm (demo)</button></div></div></div>`;const confirm=document.getElementById('confirm-modal');confirm.onclick=()=>{node.innerHTML='';onConfirm?.()};confirm.focus();}
function handleAction(action){if(!action)return;if(action.startsWith('go:'))return go(action.slice(3));if(action==='drawer'){state.drawer=!state.drawer;render();return}if(action.startsWith('theme:')){state.theme=action.split(':')[1];saveTheme(state.theme);render();return}if(action.startsWith('report:')){state.reportMode=action.split(':')[1];render();return}if(action==='toggle-server'){state.server=!state.server;render();return}if(action==='close-modal'){document.getElementById('dialog-root').innerHTML='';return}if(action==='qty:plus'||action==='qty:minus'){state.quantity=Math.max(1,(Number(document.getElementById('posQuantity')?.value)||1)+(action.endsWith('plus')?1:-1));render();return}if(action==='search-products'){state.prodSearch=document.getElementById('prod-search')?.value||'';render();return}if(action==='clear-products'){state.prodSearch='';render();return}if(action==='search-sales'){state.saleSearch=document.getElementById('sales-search')?.value||'';render();return}if(action==='clear-sales'){state.saleSearch='';render();return}if(action.startsWith('show:')){toast(action.slice(5));return}if(action==='mock-filter'){toast('Demo filters — no backend query was made.');return}}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(el){ev.preventDefault();handleAction(el.dataset.action)}});
document.addEventListener('change',ev=>{if(ev.target.id==='role'){state.role=ev.target.value;go(state.role==='admin'?'dashboard':'pos')}if(ev.target.id==='posProduct')state.product=ev.target.value;if(ev.target.id==='posQuantity')state.quantity=ev.target.value;if(ev.target.id==='posPrice')state.price=ev.target.value});
document.addEventListener('input',ev=>{if(ev.target.id==='posQuantity'||ev.target.id==='posPrice'){state.quantity=document.getElementById('posQuantity')?.value;state.price=document.getElementById('posPrice')?.value;const el=document.getElementById('pos-total');if(el)el.textContent=rs((Number(state.quantity)||0)*(Number(state.price)||0));}});
document.addEventListener('submit',ev=>{const f=ev.target.closest('form[data-form]');if(!f)return;ev.preventDefault();if(!f.reportValidity())return;let type=f.dataset.form;if(type==='login'){go(state.role==='admin'?'dashboard':'pos');toast('Demo login — no authentication performed.');return}if(type==='pos'){if(!state.server){toast('Cannot reach local shop server (simulated). No sale saved.');return}const q=Number(document.getElementById('posQuantity')?.value),p=Number(document.getElementById('posPrice')?.value);if(!Number.isInteger(q)||q<=0||!Number.isFinite(p)||p<=0){toast('Enter a valid quantity and positive selling price.');return}state.lastSale={id:'DEMO-01043',name:findProduct(state.product).name,qty:q,price:p,total:q*p};state.quantity=1;state.price='1200';go('pos-success');return}if(type==='reprice'){let cost=Number(document.getElementById('newCost')?.value);modal('Review purchase-cost update',`<p>Change the selected product's cost to <strong>${rs(cost)}</strong> for <strong>all remaining units</strong>.</p><div class="notice warning">Previously completed sales retain their original purchase costs and profit.</div>`,()=>toast('Demo preview only — no purchase cost was changed.'));return}if(type==='adjust'){let n=Number(document.getElementById('correctedStock')?.value);modal('Review stock correction',`<p>Change current inventory from <strong>5</strong> to <strong>${e(n)}</strong> units, a ${n-5>=0?'+':''}${n-5} movement.</p><p class="muted">Real implementation requires transaction/audit log.</p>`,()=>toast('Demo preview only — no stock was changed.'));return}if(type==='correct-sale'){let q=Number(document.getElementById('correctedQty')?.value);modal('Review sale correction',`<p>Change sale quantity from 2 to <strong>${e(q)}</strong>. Estimated stock movement: <strong>${2-q>=0?'+':''}${2-q} units</strong>.</p><div class="notice warning">Real system must atomically recalculate profit using the original sale-time cost and preserve an audit trail.</div>`,()=>toast('Demo preview only — no sale was corrected.'));return}if(type==='receive'){modal('Review stock receipt',`<p>This is a sample confirmation. Receiving stock must update inventory and record a receipt in the real database.</p><div class="notice warning">Different incoming purchase costs require the approved repricing policy.</div>`,()=>toast('Demo preview only — no stock was received.'));return}if(type==='product'){toast('Demo form submitted. No product was saved.');return}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){document.getElementById('dialog-root').innerHTML='';if(state.drawer){state.drawer=false;render()}}});
render();
</script>
</body>
</html>
